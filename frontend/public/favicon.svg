<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- rxed square mark: "rx" on volt. Hand-drawn paths, not <text> — an SVG favicon cannot load a
       webfont, so <text> would render in whatever mono the browser happens to pick. The hexes are
       literal by necessity: this file sits outside the document and cannot read a custom property.
       Design law v3 §10.2 sanctions this as the one asset-level exception to tokens-only. -->
  <rect width="32" height="32" rx="4" fill="#dfff4e"/>
  <!-- r -->
  <rect x="6" y="11" width="4" height="14" fill="#0d110e"/>
  <rect x="9" y="11" width="6" height="4" fill="#0d110e"/>
  <!-- x -->
  <path d="M17 11h4.4l2.1 3.6 2.1-3.6H30l-4.2 6.6L30 25h-4.4l-2.1-3.8L21.4 25H17l4.2-7.4z" fill="#0d110e"/>
</svg>
