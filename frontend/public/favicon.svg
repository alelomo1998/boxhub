<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- rxed square mark: "rx" on volt. Hand-drawn paths, not <text> — an SVG favicon cannot load a
       webfont, so <text> would render in whatever mono the browser happens to pick. The hexes are
       literal by necessity: this file sits outside the document and cannot read a custom property.
       Design law v3 §10.2 sanctions this as the one asset-level exception to tokens-only.

       Drawn on a 16-unit grid rather than 32, so the "r" lands on whole pixels at favicon size —
       verified by rasterising to 16px and magnifying it, not by looking at the vector. Two earlier
       attempts failed that check: the 32-grid version antialiased the r into grey fringing, and a
       thicker-stroked x merged into a solid blob. The x stroke is deliberately THIN (1.9): at this
       size a heavier diagonal fills its own counters and stops reading as a letter. -->
  <rect width="16" height="16" rx="3" fill="#dfff4e"/>
  <!-- r: stem and arm, both on whole pixels -->
  <rect x="2" y="5" width="2" height="7" fill="#0d110e"/>
  <rect x="4" y="5" width="3" height="2" fill="#0d110e"/>
  <!-- x: two diagonals, spaced wide enough that the crossing keeps its counters open -->
  <g stroke="#0d110e" stroke-width="1.9">
    <line x1="8.8" y1="5.6" x2="13.6" y2="11.4"/>
    <line x1="13.6" y1="5.6" x2="8.8" y2="11.4"/>
  </g>
</svg>
