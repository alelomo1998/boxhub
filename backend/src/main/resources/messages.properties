# Mail-template message bundle, resolved through Thymeleaf's #{...} against users.locale (see
# Mailer.resolveLocale). Deliberately named with no _en suffix: it is the ResourceBundle "root"
# bundle, so ANY requested Locale falls back to it when no more-specific file exists — the right
# behavior for "English is the only locale that ships" today, and it means a stray/unsupported
# locale value degrades to English instead of throwing NoSuchMessageException.
#
# Keys with a {0}/{1} placeholder are resolved with Thymeleaf's #{key(${arg})} syntax, which
# always routes through java.text.MessageFormat — a literal apostrophe in one of THOSE values
# must be escaped as '' (see boxRejected.title/body below). Keys with no placeholder skip
# MessageFormat entirely and take a literal apostrophe as-is (see paymentReceipt.thanks).

# Shared across templates
mail.greeting=Hi {0},
mail.expires24h=This link expires in 24 hours.
mail.expires1h=This link expires in 1 hour.
mail.footer=If you did not expect this email, ignore it.

# box-approved.html
boxApproved.title={0} is live — invite your members.
boxApproved.body=Your box has been approved on {0}. Head in and start setting up your schedule.
boxApproved.cta=Go to {0}

# box-rejected.html
boxRejected.title=We can''t onboard {0} right now.
boxRejected.body=After review, we''re not able to bring your box onto {0} at this time. Reply to this email if you have questions.

# email-change.html
emailChange.body=Confirm your new email address to finish updating your {0} account.
emailChange.cta=Confirm new email

# invite.html
invite.title={0} invited you to join them on {1}.
invite.cta=Accept invite

# password-changed.html
passwordChanged.body=The password on your {0} account was just changed.
passwordChanged.warning=If this wasn't you, reset your password immediately to lock them back out.
passwordChanged.cta=Reset your password

# payment-failed.html
paymentFailed.before=Your payment of
paymentFailed.after=did not go through. No membership was granted.
paymentFailed.cta=Try again

# payment-receipt.html
