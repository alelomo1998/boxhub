spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/boxhub}
    username: ${SPRING_DATASOURCE_USERNAME:boxhub}
    password: ${SPRING_DATASOURCE_PASSWORD:boxhub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${BOXHUB_SMTP_HOST:localhost}
    port: ${BOXHUB_SMTP_PORT:1025}
    username: ${BOXHUB_SMTP_USER:}
    password: ${BOXHUB_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${BOXHUB_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${BOXHUB_SMTP_TLS:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
boxhub:
  jwt:
    secret: ${BOXHUB_JWT_SECRET:dev-only-secret-must-be-at-least-32-bytes!}
    access-ttl: 15m
    refresh-ttl: 30d
  cookie:
    secure: ${BOXHUB_COOKIE_SECURE:false}
  superadmin-emails: ${BOXHUB_SUPERADMIN_EMAILS:}
  auth-rate-limit: ${BOXHUB_AUTH_RATE_LIMIT:10}
  media-dir: ${BOXHUB_MEDIA_DIR:./media}
  app-url: ${BOXHUB_APP_URL:http://localhost}
  mail:
    from: ${BOXHUB_MAIL_FROM:BoxHub <no-reply@boxhub.local>}
