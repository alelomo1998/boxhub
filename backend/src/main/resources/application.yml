spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/boxhub}
    username: ${SPRING_DATASOURCE_USERNAME:boxhub}
    password: ${SPRING_DATASOURCE_PASSWORD:boxhub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${BOXHUB_SMTP_HOST:localhost}
    port: ${BOXHUB_SMTP_PORT:1025}
    username: ${BOXHUB_SMTP_USER:}
    password: ${BOXHUB_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${BOXHUB_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${BOXHUB_SMTP_TLS:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
boxhub:
  jwt:
    # No default — a committed signing key lets anyone mint a BOX_ADMIN token for any deploy that
    # forgot the env var, and the deploy would boot happily. Same fail-closed rule as the two
    # secrets below; enforced by SecretDefaultsTest.
    secret: ${BOXHUB_JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 30d
  cookie:
    secure: ${BOXHUB_COOKIE_SECURE:false}
  superadmin-emails: ${BOXHUB_SUPERADMIN_EMAILS:}
  auth-rate-limit: ${BOXHUB_AUTH_RATE_LIMIT:10}
  # Abuse backstops, not quotas — deliberately loose. A whole box sits behind ONE NAT public IP
  # (gym WiFi), and a class opening at midnight produces a genuine booking rush; a false 429 on
  # booking is a product bug, not a save. These exist to stop credential-stuffing/scraping, not
  # to throttle real traffic.
  rate-limit:
    write: ${BOXHUB_WRITE_RATE_LIMIT:60}        # per IP per minute — invites/media/checkout/booking
    lookup: ${BOXHUB_LOOKUP_RATE_LIMIT:120}     # per IP per minute — invite preview + receipts
    # Fixed 1-minute window (Caffeine expireAfterWrite), not sliding. A whole gym shares one NAT
    # public IP, so this is sized so one busy member cannot 429 their box's coaches mid-class.
    # It has NOT been measured against a real class-opening rush — do that before launch, and if
    # it is tight, split authenticated traffic into its own higher bucket rather than just
    # raising this (see docs/BACKLOG.md).
    global: ${BOXHUB_GLOBAL_RATE_LIMIT:1200}    # per IP per minute, ALL /api/ requests
  media-dir: ${BOXHUB_MEDIA_DIR:./media}
  media:
    # No default — same reasoning as boxhub.stripe.enc-keys below: a missing secret must fail
    # startup, not boot with a guessable/committed link secret that lets every media URL be forged.
    link-secret: ${BOXHUB_MEDIA_LINK_SECRET}
  app-url: ${BOXHUB_APP_URL:http://localhost}
  # The Angular app lives here; the API (/api) and the OAuth2 callback (/login/oauth2/) stay at the
  # server root. See AppUrls — prefixing the OAuth redirect-uri breaks Google SSO in production only.
  app-base: ${BOXHUB_APP_BASE:/app}
  mail:
    # "BoxHub" here is a literal, not a reference — a YAML default can't read a Java constant.
    # Keep in sync by hand with Brand.NAME (backend .../shared/Brand.java), the single source
    # for every other occurrence of the brand name on the backend (mail templates via Mailer).
    from: ${BOXHUB_MAIL_FROM:rxed <no-reply@rxed.app>}
  # No default here — deliberately. ${BOXHUB_STRIPE_ENC_KEYS} with no fallback fails Spring's
  # placeholder resolution at boot if the var is unset, before CryptoService's 32-byte check
  # ever runs. A committed default would be a real usable master key sitting in git history;
  # every environment that must boot (docker-compose, tests) supplies its own value instead.
  # SecretDefaultsTest enforces this for every secret-shaped property in this file.
  #
  # Format: comma-separated version:base64key, newest first (see CryptoService). Migrating a
  # deploy that predates versioning: BOXHUB_STRIPE_ENC_KEYS=1:$OLD_BOXHUB_STRIPE_ENC_KEY —
  # unprefixed rows decrypt under v1, so nothing has to be re-encrypted.
  stripe:
    enc-keys: ${BOXHUB_STRIPE_ENC_KEYS}
# Deviation from the M8 plan: no spring.security.oauth2.client.registration.* block, and no
# boxhub.google.* block either — OAuth2SecurityConfig reads BOXHUB_GOOGLE_CLIENT_ID and
# BOXHUB_GOOGLE_CLIENT_SECRET directly as env vars (@ConditionalOnProperty + @Value). Two
# real Spring Boot gotchas forced this: (1) Boot's OAuth2ClientAutoConfiguration treats ANY
# bound sub-property under spring.security.oauth2.client.registration.* as "a client is
# configured" and eagerly builds+validates a ClientRegistration, throwing
# IllegalStateException("Client id ... must not be empty") at startup whenever the id is
# blank — crashing every dev/CI/test run. (2) @ConditionalOnProperty("some.key") without
# havingValue matches on ANY non-null value, including "" — so a YAML property given an
# empty-string default via ${VAR:} (e.g. boxhub.google.client-id: ${BOXHUB_GOOGLE_CLIENT_ID:})
# always resolves to "" and the conditional NEVER turns off. Binding directly to the raw env
# var (present only when actually exported) is the only property source where "unset" reads
# back as null, which is what makes the conditional actually conditional.
