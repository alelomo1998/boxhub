<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: html}">
<th:block th:fragment="content">
  <p th:text="'Hi ' + ${name} + ','">Hi,</p>
  <p th:text="'Your ' + ${planName} + ' membership has lapsed — renew to keep booking classes.'">Membership lapsed.</p>
  <p style="padding:16px 0;">
    <a th:href="${link}" style="background:#D7263D;color:#fff;text-decoration:none;padding:14px 24px;border-radius:10px;display:inline-block;font-weight:600;">Renew my membership</a>
  </p>
</th:block>
</html>
