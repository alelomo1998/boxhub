<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: html}">
<th:block th:fragment="content">
  <p th:text="#{mail.greeting(${name})}">Hi,</p>
  <p th:text="#{paymentReceipt.thanks}">Thanks — we've recorded your payment.</p>
  <p style="padding:8px 0;">
    <strong th:text="${planName}">Plan</strong><br/>
    <span th:text="${amountCents / 100.0} + ' ' + ${#strings.toUpperCase(currency)} + ' (' + ${method} + ')'">Amount</span>
  </p>
  <p th:if="${hasDiscount}" style="color:#8A8078;font-size:13px;">
    <span th:text="#{paymentReceipt.discountBefore}">Negotiated discount applied — list price</span>
    <span th:text="${listPriceCents / 100.0} + ' ' + ${#strings.toUpperCase(currency)}">list</span>.
  </p>
  <p style="padding:16px 0;">
    <a th:href="${link}" th:text="#{paymentReceipt.cta}" style="background:#D7263D;color:#fff;text-decoration:none;padding:14px 24px;border-radius:10px;display:inline-block;font-weight:600;">View my receipt</a>
  </p>
</th:block>
</html>
