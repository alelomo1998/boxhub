<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: html}">
<th:block th:fragment="content">
  <p th:text="#{mail.greeting(${name})}">Hi,</p>
  <p th:text="#{passwordChanged.body(${brand})}">The password on your rxed account was just changed.</p>
  <p th:text="#{passwordChanged.warning}">If this wasn't you, reset your password immediately to lock them back out.</p>
  <p style="padding:16px 0;">
    <a th:href="${link}" th:text="#{passwordChanged.cta}" style="background:#dfff4e;color:#0d110e;text-decoration:none;padding:14px 24px;border-radius:10px;display:inline-block;font-weight:600;">Reset your password</a>
  </p>
</th:block>
</html>
