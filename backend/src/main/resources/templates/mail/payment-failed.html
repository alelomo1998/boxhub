<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: html}">
<th:block th:fragment="content">
  <p th:text="#{mail.greeting(${name})}">Hi,</p>
  <p>
    <span th:text="#{paymentFailed.before}">Your payment of</span>
    <strong th:text="${amountCents / 100.0} + ' ' + ${#strings.toUpperCase(currency)}">Amount</strong>
    <span th:text="#{paymentFailed.after}">did not go through. No membership was granted.</span>
  </p>
  <p style="padding:16px 0;">
    <a th:href="${link}" th:text="#{paymentFailed.cta}" style="background:#D7263D;color:#fff;text-decoration:none;padding:14px 24px;border-radius:10px;display:inline-block;font-weight:600;">Try again</a>
  </p>
</th:block>
</html>
