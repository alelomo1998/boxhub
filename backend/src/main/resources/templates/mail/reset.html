<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: html}">
<th:block th:fragment="content">
  <p th:text="#{mail.greeting(${name})}">Hi,</p>
  <p th:text="#{reset.body(${brand})}">Reset your password to get back into your rxed account.</p>
  <p style="padding:16px 0;">
    <a th:href="${link}" th:text="#{reset.cta}" style="background:#D7263D;color:#fff;text-decoration:none;padding:14px 24px;border-radius:10px;display:inline-block;font-weight:600;">Reset your password</a>
  </p>
  <p style="color:#8A8078;font-size:13px;" th:text="#{mail.expires1h}">This link expires in 1 hour.</p>
</th:block>
</html>
