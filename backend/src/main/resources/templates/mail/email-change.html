<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: html}">
<th:block th:fragment="content">
  <p th:text="#{mail.greeting(${name})}">Hi,</p>
  <p th:text="#{emailChange.body(${brand})}">Confirm your new email address to finish updating your rxed account.</p>
  <p style="padding:16px 0;">
    <a th:href="${link}" th:text="#{emailChange.cta}" style="background:#dfff4e;color:#0d110e;text-decoration:none;padding:14px 24px;border-radius:10px;display:inline-block;font-weight:600;">Confirm new email</a>
  </p>
  <p style="color:#8A8078;font-size:13px;" th:text="#{mail.expires24h}">This link expires in 24 hours.</p>
</th:block>
</html>
