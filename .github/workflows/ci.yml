name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: cd backend && mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      # Tightened from --audit-level=critical to high on 2026-08-02, once M13a's Angular
      # 19->22 upgrade removed the SSR-hydration CVE cascade that had been holding it open.
      # Measured before flipping: `npm audit --audit-level=high --omit=dev` exits 0.
      # --omit=dev is KEPT, deliberately. With dev dependencies included there are still 3
      # high advisories, all transitive and all dev-only: brace-expansion, fast-uri, and
      # socket.io-parser (the last arriving via Karma). None of them ships to a user, so
      # gating every push on them would block real work to no security benefit. The nightly
      # job in dependency-scan.yml keeps that full list visible.
      - run: cd frontend && npm audit --audit-level=high --omit=dev
      - run: cd frontend && npm test -- --watch=false --browsers=ChromeHeadless
      - run: cd frontend && npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: cp docker/.env.example docker/.env
      - run: docker compose -f docker/docker-compose.yml up -d --build
      - run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost/actuator/health && exit 0
            sleep 2
          done
          echo "app never became healthy"; exit 1
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: cd e2e && npx playwright test
      - if: always()
        run: docker compose -f docker/docker-compose.yml logs --tail 100
