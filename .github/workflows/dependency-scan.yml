name: dependency-scan
# Nightly OWASP dependency-check scan of backend/ Maven dependencies against the NVD CVE
# feed, failing the job on any finding with CVSS >= 7 (see backend/pom.xml for the plugin
# config and backend/owasp-suppressions.xml for reviewed suppressions).
#
# This job CANNOT do anything useful without the NVD_API_KEY repository secret. Without a
# key, the NVD CVE database sync is rate-limited hard enough that it takes hours and
# routinely times out -- which is also why this does not run on every push (see the
# `backend` job in ci.yml, which never touches this plugin). Add the secret at
# Settings > Secrets and variables > Actions > New repository secret > NVD_API_KEY
# (request a free key at https://nvd.nist.gov/developers/request-an-api-key). Until that
# secret exists, both the schedule and manual runs of this workflow will fail or hang.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/cache@v4
        with:
          path: backend/dependency-check-data
          key: dependency-check-data-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            dependency-check-data-
      - name: OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: cd backend && mvn -B org.owasp:dependency-check-maven:check

  frontend-audit-informational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      # Informational only (continue-on-error): every high-severity advisory today is a
      # cascade of Angular 19's SSR-hydration CVE, which this client-rendered-only app
      # cannot hit (no provideClientHydration/@angular/ssr anywhere in frontend/src). The
      # only fix is Angular 19->22, a breaking major upgrade scheduled for M12 (frontend
      # rework) -- not something to force into the last task of a security branch. The
      # per-push gate in ci.yml stays at --audit-level=critical --omit=dev (green today)
      # so this step exists purely to keep the full high-severity list visible every
      # night without wedging the job. When M12 lands: drop continue-on-error here and
      # flip the ci.yml gate to --audit-level=high.
      - run: cd frontend && npm audit --audit-level=high
        continue-on-error: true
