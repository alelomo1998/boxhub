name: dependency-scan
# Vulnerability scan of backend (Maven) and frontend/e2e (npm) dependencies against the OSV
# database. Runs on every push and PR because it needs no credentials and finishes in seconds.
#
# This replaced OWASP dependency-check, which had to be nightly-only for one reason: it mirrors
# the whole NVD feed, and without an NVD API key that sync takes hours and times out. A scan that
# only runs at 4am and needs a secret nobody added is not a gate. OSV carries the same advisories
# for these ecosystems, resolves Maven transitives from pom.xml, and gates the push instead.
#
# WHY THIS GATES THE BACKEND ONLY: osv-scanner has no severity threshold — it fails on any
# finding at all. That is the right policy for the backend, which scans clean today and should
# stay that way. It is the wrong policy for npm, where we knowingly carry Angular 19's
# advisories until the 19->22 upgrade in M12, so an npm-inclusive gate would be red forever and
# stop being read. npm keeps the two-tier policy decided for it: `npm audit --audit-level=critical
# --omit=dev` gates every push in ci.yml, and the informational job below prints the full
# high-severity list every run. Fold npm into this gate once M12 lands.
#
# Findings that are real but deliberately not blocking go in osv-scanner.toml at the repo root,
# each with a written reason and a review date — an unsuppressed noisy scan gets ignored by
# humans, which is worse than no scan.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Also weekly, so an advisory published against unchanged code still surfaces.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }

      # osv-scanner cannot read this pom.xml directly: its Maven resolver fails on any
      # dependency whose version comes from the Spring Boot parent BOM rather than the pom
      # ("failed parsing version constraint ... invalid > in >=0.0.0"), and it then skips the
      # whole Maven side while still exiting 0. An SBOM sidesteps that and is more accurate
      # anyway — it is the classpath Maven actually resolved, not a guess parsed from XML.
      - name: Generate the backend SBOM
        run: cd backend && mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      # Explicit path, not --recursive: recursing would find pom.xml again and re-trigger the
      # extraction failure above. Backend only — see the severity note at the top of this file.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --format=json
            --all-packages
            --output=osv-results.json
            --sbom=backend/target/bom.json

      # The action exits 0 when osv-scanner rejects its own arguments — it prints usage and
      # the job goes green having scanned nothing. That is exactly how this shipped the first
      # time (`--skip-git` was removed upstream). So do not trust the exit code: assert the
      # scan actually reached our manifests. `if: always()` because the step above legitimately
      # fails the job when it finds a vulnerability, and we still want to know it really ran.
      - name: Assert the scan actually covered our manifests
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          f = pathlib.Path("osv-results.json")
          if not f.exists():
              sys.exit("osv-results.json missing — the scanner never ran (check its arguments)")
          data = json.loads(f.read_text())
          # Assert on the ECOSYSTEM, not a file path: what matters is that the backend was
          # really examined, and that stays true if the SBOM moves or is renamed.
          seen = {}
          for r in data.get("results", []):
              src = r.get("source", {}).get("path", "?")
              for p in r.get("packages", []):
                  eco = p.get("package", {}).get("ecosystem", "?")
                  seen.setdefault(eco, set()).add(src)
          for eco, srcs in sorted(seen.items()):
              print(f"{eco}: {sorted(srcs)}")
          if "Maven" not in seen:
              sys.exit("no Maven packages were scanned — the backend is unprotected")
          PY

  frontend-audit-informational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      # Still informational only (continue-on-error), and M13a's plan said to drop that — the
      # measurement said otherwise, so it stays. Angular 19->22 did clear the SSR-hydration
      # cascade this comment used to describe, and the per-push gate in ci.yml tightened to
      # --audit-level=high --omit=dev on 2026-08-02 as a result.
      #
      # But this step runs WITHOUT --omit=dev and exits 1 on three transitive dev-only
      # advisories: brace-expansion, fast-uri, socket.io-parser (via Karma). Dropping
      # continue-on-error would make the nightly job permanently red over packages that never
      # reach a user — which is how a scan stops being read at all.
      #
      # Revisit when the Karma builder moves to @angular/build:karma (backlog, M13c), since
      # that is where socket.io-parser comes from.
      - run: cd frontend && npm audit --audit-level=high
        continue-on-error: true
