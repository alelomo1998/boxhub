version: 2

# This file configures VERSION UPDATES only. Dependabot SECURITY ALERTS are a repository
# setting and are independent of it — they stay on regardless of anything here, and they are
# the half that actually matters. Everything below is about keeping routine bumps from
# becoming noise.
#
# The first run of the original config opened ~12 pull requests at once, almost all failing
# major bumps (Angular 22, Spring Boot 4.1, Node 26, TypeScript 7). A wall of red PRs gets
# ignored, and an ignored bot is worse than no bot. Hence: monthly, grouped into one PR per
# ecosystem, capped, and majors excluded.
#
# Majors are excluded on purpose, not out of laziness. A framework major here is a project,
# not a bump: Angular 19 -> 22 is M12's own milestone, and Spring Boot 3.4 -> 4.x would move
# the whole security stack that M11 just hardened. Those get planned, not merged by a bot.
# Patches and minors are exactly what automation should carry.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # These two are pinned BY Angular, not by us: @angular-devkit/build-angular@19.x declares
      # `peer typescript@">=5.5 <5.9"` and Angular 19 similarly pins zone.js to 0.15.x. A routine
      # minor bump of either makes `npm ci` fail outright with ERESOLVE — it already did, and
      # because updates are grouped it blocked four unrelated packages with it. They move when
      # Angular moves (M12), so they are Angular's business, not Dependabot's.
      - dependency-name: "typescript"
      - dependency-name: "zone.js"

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      e2e-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Actions are tracked by floating MAJOR tag — checkout@v7, setup-java@v5, setup-node@v7 —
  # which already receives every patch and minor automatically. A minor/patch PR against one of
  # them does not deliver a fix we would not otherwise get; it PINS the action and freezes it,
  # so every future patch then needs its own PR. PR #22 (setup-java v5 -> v5.6.0) was exactly
  # that and was closed rather than merged. Majors still come through, because v5 -> v6 is a
  # real event that deserves a human. osv-scanner-action is deliberately NOT listed here: it is
  # pinned exact (@v2.3.8), so for that one a patch bump is the only way it ever moves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "actions/setup-java"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "actions/setup-node"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # Base images only (postgres, nginx, node, maven, temurin). Majors excluded for the same
  # reason: a Node or Postgres major is a deliberate upgrade, not a bot merge.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The build and runtime JDK are pinned to 21 on purpose — Boot and the toolchain are
      # tested there, and JDK 26 is too new (see docs/HANDOFF.md). Dependabot cannot see that:
      # it read `maven:3.9-eclipse-temurin-21` -> `3-eclipse-temurin-26` as a routine bump, not
      # a major, and opened a PR that would have silently compiled the backend on JDK 26.
      # Bump the JDK by editing the Dockerfiles deliberately, not by merging a bot PR.
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"
