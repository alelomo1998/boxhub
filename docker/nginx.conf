# Same as the stock "combined" format but $uri in place of $request: the TV stream token now
# rides in the httpOnly bh_tv cookie (M11 T5), not the query string, but this keeps the query
# string out of the log on principle — a future GET with params on this path stays unlogged too.
log_format combined_noquery '$remote_addr - $remote_user [$time_local] '
                             '"$uri" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # M11 T11: security headers (nosniff, referrer, permissions, HSTS, CSP). Locations below with
    # their own add_header (/media/, = /index.html) re-include this — see security-headers.conf
    # for why it isn't enough to declare it only here.
    include /etc/nginx/snippets/security-headers.conf;

    location /api/tv/stream {
        access_log /var/log/nginx/access.log combined_noquery;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Load-bearing since M11 T9: the rate limiter's global per-IP ceiling counts EVERY /api/
        # request, and AuthRateLimitFilter falls back to getRemoteAddr() without this header —
        # which here is nginx's own container IP. Every paired TV on the platform would then share
        # one bucket, so a backend restart (all TVs reconnecting at once) could 429 them all.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    location /media/ {
        # ${BOXHUB_MEDIA_LINK_SECRET} is filled in by the image's envsubst-on-templates
        # entrypoint at container start (this file ships as nginx.conf.template — see
        # frontend.Dockerfile). Formula must match MediaSigner.sign() exactly: keyed MD5 over
        # "<expires><uri> <secret>", so forgery needs the secret, not a collision.
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri ${BOXHUB_MEDIA_LINK_SECRET}";

        if ($secure_link = "") { return 403; }   # bad signature
        if ($secure_link = "0") { return 410; }  # expired

        alias /media/;
        expires 10m;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private";
    }

    location / {
        # M11 T11: nonce for Angular component styles (style-src 'nonce-...' in the CSP above).
        # Angular reads ngCspNonce off the root element; $request_id is per-request, matching
        # the nonce the CSP header carries for the same request. sub_filter only rewrites
        # text/html by default, which is what we want. index.html has no other inline script.
        sub_filter '<app-root></app-root>' '<app-root ngCspNonce="$request_id"></app-root>';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
    }

    # The SPA entrypoint must never be cached, or a rebuild (new content-hashed chunk names)
    # leaves a stale index.html pointing at chunks that no longer exist → module-MIME errors.
    # Hashed JS/CSS are safe to cache (names change per build); only the HTML must revalidate.
    location = /index.html {
        sub_filter '<app-root></app-root>' '<app-root ngCspNonce="$request_id"></app-root>';
        sub_filter_once on;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
