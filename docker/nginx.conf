# Same as the stock "combined" format but $uri in place of $request: the TV stream token now
# rides in the httpOnly bh_tv cookie (M11 T5), not the query string, but this keeps the query
# string out of the log on principle — a future GET with params on this path stays unlogged too.
log_format combined_noquery '$remote_addr - $remote_user [$time_local] '
                             '"$uri" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/tv/stream {
        access_log /var/log/nginx/access.log combined_noquery;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    location /media/ {
        # ${BOXHUB_MEDIA_LINK_SECRET} is filled in by the image's envsubst-on-templates
        # entrypoint at container start (this file ships as nginx.conf.template — see
        # frontend.Dockerfile). Formula must match MediaSigner.sign() exactly: keyed MD5 over
        # "<expires><uri> <secret>", so forgery needs the secret, not a collision.
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri ${BOXHUB_MEDIA_LINK_SECRET}";

        if ($secure_link = "") { return 403; }   # bad signature
        if ($secure_link = "0") { return 410; }  # expired

        alias /media/;
        expires 10m;
        add_header Cache-Control "private";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA entrypoint must never be cached, or a rebuild (new content-hashed chunk names)
    # leaves a stale index.html pointing at chunks that no longer exist → module-MIME errors.
    # Hashed JS/CSS are safe to cache (names change per build); only the HTML must revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
