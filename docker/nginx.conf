server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/tv/stream {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA entrypoint must never be cached, or a rebuild (new content-hashed chunk names)
    # leaves a stale index.html pointing at chunks that no longer exist → module-MIME errors.
    # Hashed JS/CSS are safe to cache (names change per build); only the HTML must revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
