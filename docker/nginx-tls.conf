# Same as the stock "combined" format but $uri in place of $request: the TV stream token now
# rides in the httpOnly bh_tv cookie (M11 T5), not the query string, but this keeps the query
# string out of the log on principle — a future GET with params on this path stays unlogged too.
log_format combined_noquery '$remote_addr - $remote_user [$time_local] '
                             '"$uri" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';

server {
    # M13a Task 7: opt-in TLS server for local verification of BOXHUB_COOKIE_SECURE, HSTS and the
    # CSP under a real https:// origin — none of which the plain-HTTP nginx.conf can ever exercise.
    # Everything below this listen/ssl_* pair is an exact copy of nginx.conf; keep them in sync by
    # hand (nginx has no conditional-on-file-existence directive to unify them, and templating the
    # difference away risks the plain-HTTP default path this task must not touch).
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/boxhub.local.crt;
    ssl_certificate_key /etc/nginx/tls/boxhub.local.key;
    root /usr/share/nginx/html;
    index index.html;

    # M13a: nginx's `return 301 <path>` auto-prepends $scheme://$host to a relative target, which
    # is spec-legal but not what the old-path redirects below are written to assert against. This
    # is the dedicated directive for that — NOT add_header, so it doesn't touch the
    # inherited-security-header concern noted just below. Doesn't affect proxy_pass locations
    # (their Location headers, e.g. Google's OAuth 302, come from upstream, untouched by this).
    absolute_redirect off;

    # M11 T11: security headers (nosniff, referrer, permissions, HSTS, CSP). Locations below with
    # their own add_header (/media/, = /index.html) re-include this — see security-headers.conf
    # for why it isn't enough to declare it only here.
    include /etc/nginx/snippets/security-headers.conf;

    location /api/tv/stream {
        access_log /var/log/nginx/access.log combined_noquery;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Load-bearing since M11 T9: the rate limiter's global per-IP ceiling counts EVERY /api/
        # request, and AuthRateLimitFilter falls back to getRemoteAddr() without this header —
        # which here is nginx's own container IP. Every paired TV on the platform would then share
        # one bucket, so a backend restart (all TVs reconnecting at once) could 429 them all.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Google SSO. Spring's OAuth2 chain matches /oauth2/** (the authorization redirect) and
    # /login/oauth2/** (Google's callback) — see OAuth2SecurityConfig.securityMatcher. Without
    # these two blocks both fall through to the SPA catch-all below and the login page's Google
    # button silently does nothing, which is how it shipped from M8 to M12c.
    #
    # No add_header here on purpose: nginx's add_header REPLACES rather than merges, so a
    # location that sets one loses every server-level security header. These inherit.
    #
    # The redirect_uri comes from BOXHUB_APP_URL (OAuth2SecurityConfig), not from any of these
    # headers — deliberately: trusting X-Forwarded-For to rebuild the request would also feed
    # AuthRateLimitFilter's IP resolution, reopening the spoofing M1-T9 closed. They're set here
    # for parity with the /api/ block above, not because anything here reads them for URL
    # construction.
    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/ {
        # ${BOXHUB_MEDIA_LINK_SECRET} is filled in by the image's envsubst-on-templates
        # entrypoint at container start (this file ships as nginx.conf.template — see
        # frontend.Dockerfile). Formula must match MediaSigner.sign() exactly: keyed MD5 over
        # "<expires><uri> <secret>", so forgery needs the secret, not a collision.
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri ${BOXHUB_MEDIA_LINK_SECRET}";

        if ($secure_link = "") { return 403; }   # bad signature
        if ($secure_link = "0") { return 410; }  # expired

        alias /media/;
        expires 10m;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private";
    }

    # M13a: the app moved under /app. The build still lands flat at /usr/share/nginx/html (see
    # frontend.Dockerfile — no /app subdirectory on disk), so this location uses `alias`, not
    # `root`, to strip the /app prefix back off before hitting the filesystem.
    location /app/ {
        alias /usr/share/nginx/html/;
        # M11 T11: nonce for Angular component styles (style-src 'nonce-...' in the CSP above).
        # Angular reads ngCspNonce off the root element; $request_id is per-request, matching
        # the nonce the CSP header carries for the same request. sub_filter only rewrites
        # text/html by default, which is what we want. index.html has no other inline script.
        sub_filter '<app-root></app-root>' '<app-root ngCspNonce="$request_id"></app-root>';
        sub_filter_once on;
        # The fallback is an absolute URI, not a filesystem path: nginx re-runs location
        # matching on it, landing in the `location = /app/index.html` block below rather than
        # resolving through this block's alias.
        try_files $uri $uri/ /app/index.html;
    }

    # A bare /app (no trailing slash) matches no location above — send it to the real root.
    location = /app {
        return 301 /app/;
    }

    # The SPA entrypoint must never be cached, or a rebuild (new content-hashed chunk names)
    # leaves a stale index.html pointing at chunks that no longer exist → module-MIME errors.
    # Hashed JS/CSS are safe to cache (names change per build); only the HTML must revalidate.
    location = /app/index.html {
        alias /usr/share/nginx/html/index.html;
        sub_filter '<app-root></app-root>' '<app-root ngCspNonce="$request_id"></app-root>';
        sub_filter_once on;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # M13a: the app moved under /app, but verification, reset, invite and email-change links
    # already sitting in real inboxes point at these OLD paths and carry single-use,
    # time-limited tokens — a dead link is unrecoverable for that user. Permanent redirects,
    # preserving the query string and any path parameters via $request_uri. Only the app's own
    # top-level route prefixes are listed; deliberately no catch-all, or a typo'd /api call would
    # silently redirect instead of 404ing.
    location /auth/ { return 301 /app$request_uri; }
    location /join/ { return 301 /app$request_uri; }
    location /account/ { return 301 /app$request_uri; }
    location /athlete/ { return 301 /app$request_uri; }
    location /coach/ { return 301 /app$request_uri; }
    location /admin/ { return 301 /app$request_uri; }
    location = /superadmin { return 301 /app$request_uri; }
    location = /tv { return 301 /app$request_uri; }
    location /receipts/ { return 301 /app$request_uri; }
    location = /membership { return 301 /app$request_uri; }
    location = / { return 301 /app$request_uri; }
}
