# M11 T11: baseline security headers.
#
# Included (not just declared at `server` level) because nginx `add_header` does not inherit
# into a `location` block that declares its own `add_header` — it replaces, not merges, one
# level at a time. `location /media/` and `location = /index.html` in nginx.conf both set their
# own Cache-Control, so without this include they would silently lose every header here,
# including the CSP on index.html — the one document that most needs it. Include this file at
# `server` level AND inside every location block that has its own add_header. Do not copy-paste
# the header list — edit this one file only.
#
# Not envsubst'd (nginx.conf.template is; this snippet isn't a template) — fine, since it has no
# ${ENV_VAR} references, only the nginx runtime variable $request_id below.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Inert until TLS lands in the Production phase — ships now so it isn't forgotten later.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
