services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boxhub
      POSTGRES_USER: boxhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boxhub}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxhub -d boxhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"   # web UI — open http://localhost:8025 to read dev mail
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/boxhub
      SPRING_DATASOURCE_USERNAME: boxhub
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-boxhub}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      BOXHUB_JWT_SECRET: ${BOXHUB_JWT_SECRET:-dev-only-secret-must-be-at-least-32-bytes!}
      # Dev/e2e stack: the serial Playwright suite logs in many times from one IP within the
      # 1-min window. Prod overrides this with a strict value; keep the default relaxed here.
      BOXHUB_AUTH_RATE_LIMIT: ${BOXHUB_AUTH_RATE_LIMIT:-200}
      BOXHUB_MEDIA_DIR: /data/media
      BOXHUB_SMTP_HOST: mailpit
      BOXHUB_SMTP_PORT: "1025"
      BOXHUB_APP_URL: ${BOXHUB_APP_URL:-http://localhost}
      BOXHUB_SUPERADMIN_EMAILS: ${BOXHUB_SUPERADMIN_EMAILS:-super@demo.io}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - media:/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
